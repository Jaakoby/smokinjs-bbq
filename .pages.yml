        label: Name
        type: string
        required: true
      - name: price
        label: Price ($)
        type: number
        required: true
        options:
          min: 0
      - name: desc
        label: Description
        type: text
      - name: unit
        label: Size label
        type: string
        description: Optional, e.g. ½ lb. Leave blank if none.
      - name: img
        label: Photo
        type: image
      - name: meats
        label: How many meats the customer picks
        type: number
        description: 0 if they don't pick a meat
        options:
          min: 0
      - name: sides
        label: How many sides the customer picks
        type: number
        description: 0 if no sides come with it
        options:
          min: 0
      - name: pickSide
        label: Customer picks which side (for the single Side item)
        type: boolean
      - name: id
        label: ID (leave alone)
        type: string
        required: true
        description: Short unique code, letters only. Keep existing ones as-is; for a new item just make one up. Big Piggy must stay bp, Little Piggy lp, 1 Meat 1 Side p1 (the crew-size picker uses them).
